<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原始视频 vs 机器人复现 · 同屏对比（W6d）</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2027; --line: #2c3540;
    --fg: #e8edf2; --dim: #93a1af; --ok: #34c26b; --bad: #e5484d;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans CJK SC", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 14px; }

  /* gate badges */
  .gates { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .gate {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; min-width: 210px; flex: 1;
  }
  .gate .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .gate.pass .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .gate.fail .dot { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .gate .name { font-weight: 600; }
  .gate .verdict { font-size: 12px; padding: 0 8px; border-radius: 999px; }
  .gate.pass .verdict { color: var(--ok); border: 1px solid var(--ok); }
  .gate.fail .verdict { color: var(--bad); border: 1px solid var(--bad); }
  .gate .measured { font-size: 13px; color: var(--fg); margin-top: 2px; }
  .gate .scope { font-size: 12px; color: var(--dim); margin-top: 2px; }

  .banner {
    background: #3a3110; border: 1px solid #8a7420; color: #e8d48a;
    border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px;
  }
  .banner code { background: #241f0c; padding: 1px 6px; border-radius: 5px; }

  /* comparison panes */
  .compare { display: flex; gap: 14px; align-items: stretch; }
  .pane { flex: 1; min-width: 0; background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pane h2 {
    font-size: 15px; margin: 0; padding: 9px 14px;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  }
  .pane h2 .tag { font-size: 12px; color: var(--dim); font-weight: 400; }
  .pane .stage { position: relative; background: #000; }
  .pane img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
  .pane .caption {
    padding: 8px 14px; font-size: 13px; color: var(--dim);
    border-top: 1px solid var(--line); min-height: 40px;
  }
  .pane .caption b { color: var(--fg); font-weight: 600; }
  .presets { display: flex; gap: 6px; margin-left: auto; }
  .presets button {
    background: var(--bg); color: var(--dim); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .presets button.on { color: var(--fg); border-color: var(--accent); background: #14263d; }

  /* transport */
  .transport {
    display: flex; align-items: center; gap: 14px; margin-top: 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px;
  }
  .transport button {
    background: #14263d; color: var(--fg); border: 1px solid var(--accent);
    border-radius: 8px; padding: 6px 18px; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }
  .transport input[type=range] { flex: 1; accent-color: var(--accent); }
  .frameinfo { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .frameinfo b { color: var(--fg); }

  .foot { margin-top: 16px; color: var(--dim); font-size: 12px; }
  .foot code { background: var(--panel); padding: 1px 6px; border-radius: 5px; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>原始视频 vs 机器人复现 · 同屏对比</h1>
  <div class="sub" id="sub"></div>
  <div class="gates" id="gates"></div>
  <div class="banner" id="banner" style="display:none"></div>

  <div class="compare">
    <div class="pane">
      <h2>人类视频（原片）<span class="tag" id="vtag"></span></h2>
      <div class="stage"><img id="vimg" alt="人类视频帧"></div>
      <div class="caption" id="vcap"></div>
    </div>
    <div class="pane">
      <h2>机器人复现（MuJoCo 仿真）
        <span class="presets" id="presets"></span>
      </h2>
      <div class="stage"><img id="rimg" alt="机器人复现渲染帧"></div>
      <div class="caption" id="rcap"></div>
    </div>
  </div>

  <div class="transport">
    <button id="play">▶ 播放</button>
    <input type="range" id="slider" min="0" value="0" step="1">
    <div class="frameinfo" id="finfo"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="./panel_data_v2.js"></script>
<script>
"use strict";
const D = window.PANEL_DATA_V2;
if (!D) { document.body.innerHTML =
  '<div class="wrap"><div class="err">未找到 viz/panel_data_v2.js —— 先运行 ' +
  '<code>runs/.venv-mj/bin/python viz/replay_to_panel.py</code>。</div></div>';
  throw new Error("missing panel_data_v2.js"); }

const $ = id => document.getElementById(id);
const rf = D.replay.frames, vf = D.video_frames, meta = D.meta || {};
const state = { i: 0, preset: (meta.renders ? meta.renders.presets[0].key : "front"),
                timer: null };

/* ---------- header ---------- */
$("sub").textContent =
  `左：人手抓取纸巾盒的原片（${meta.src_video || "源视频"}，30 fps）。` +
  `右：同一任务在 MuJoCo 双 Allegro 手场景中的复现渲染。拖动下方滑块，两侧同步走帧。`;

/* ---------- gate badges ---------- */
$("gates").innerHTML = (D.gates || []).map(g => {
  const pass = String(g.verdict).toLowerCase() === "pass";
  return `<div class="gate ${pass ? "pass" : "fail"}">
    <div class="row"><span class="dot"></span>
      <span class="name">${g.name}</span>
      <span class="verdict">${pass ? "通过" : "未过"}</span></div>
    <div class="measured">${g.measured}</div>
    <div class="scope">${g.scope || ""}</div>
  </div>`;
}).join("");

/* ---------- placeholder banner ---------- */
if (meta.placeholder) {
  $("banner").style.display = "";
  $("banner").innerHTML = "<b>ⓘ 当前为占位数据。</b> " + (meta.placeholder_note || "");
}

/* ---------- image helpers ---------- */
const cache = {};
// data paths are repo-root-relative (docs/...); the panel lives in viz/,
// so every src goes up one level first
function src(p) { return p && p.startsWith("docs/") ? "../" + p : p; }
function preload(p) {
  const s = src(p);
  if (!s || cache[s]) return;
  cache[s] = new Image(); cache[s].src = s;
}

// video_frames are named f_NNNN.jpg by SOURCE frame number -> exact time;
// fall back to even spreading if naming ever changes.
function videoTime(j) {
  const m = /f_(\d+)\.jpg$/.exec(vf[j] || "");
  return m ? (parseInt(m[1], 10) - 1) / (meta.video_fps || D.fps)
           : (vf.length ? j * (rf.length ? rf[rf.length - 1].t + 1 / D.fps : 1) / vf.length : 0);
}
function nearestVideo(t) {
  let best = 0, bd = Infinity;
  for (let j = 0; j < vf.length; j++) {
    const d = Math.abs(videoTime(j) - t);
    if (d < bd) { bd = d; best = j; }
  }
  return best;
}
function segOf(file) {
  for (const s of (meta.video_segments || []))
    if (s.files.includes(file)) return s.name;
  return "";
}
function renderSrc(i) {
  const r = meta.renders;
  return r && r.frames[state.preset] && r.frames[state.preset][i] ? r.frames[state.preset][i] : null;
}

/* ---------- preset buttons ---------- */
$("presets").innerHTML = (meta.renders ? meta.renders.presets : [{key:"front",label:"正面"}])
  .map(p => `<button data-k="${p.key}">${p.label}</button>`).join("");
$("presets").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  state.preset = b.dataset.k; draw();
};

/* ---------- the single slider drives BOTH panes ---------- */
$("slider").max = rf.length - 1;
$("slider").oninput = () => { stop(); draw(+$("slider").value); };

$("play").onclick = () => state.timer ? stop() : play();
function play() {
  if (state.i >= rf.length - 1) state.i = 0;
  state.timer = setInterval(() => {
    state.i = (state.i + 1) % rf.length; draw();
  }, 700);
  $("play").textContent = "⏸ 暂停";
}
function stop() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  $("play").textContent = "▶ 播放";
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { stop(); draw(Math.min(rf.length - 1, state.i + 1)); }
  if (e.key === "ArrowLeft")  { stop(); draw(Math.max(0, state.i - 1)); }
});

/* ---------- draw one index ---------- */
function draw(i) {
  if (i === undefined) i = state.i; else state.i = i;
  $("slider").value = i;

  const fr = rf[i], t = fr.t;
  const vj = nearestVideo(t), vfile = vf[vj];
  preload(vfile);
  $("vimg").src = src(vfile);

  const sim = renderSrc(i);
  if (sim) { preload(sim); $("rimg").src = src(sim); $("rimg").style.opacity = 1; }
  else {
    $("rimg").removeAttribute("src");
    $("rimg").alt = "缺少渲染：先运行 viz/render_replay.py";
    $("rimg").style.opacity = 0.25;
  }

  const mm = Math.floor(t / 60), ss = (t - mm * 60).toFixed(2);
  $("vtag").textContent = `${vf.length} 个对比帧`;
  const seg = segOf(vfile);
  const n = /f_(\d+)\.jpg$/.exec(vfile || "");
  $("vcap").innerHTML =
    `<b>原片第 ${n ? n[1] : vj + 1} 帧</b> · t=${t.toFixed(2)} s` +
    (seg ? ` · 阶段：<b>${seg}</b>` : "") +
    `（按时间就近对齐）`;

  const note = (meta.notes_per_frame || [])[i];
  $("rcap").innerHTML =
    `<b>复现帧 ${i + 1}/${rf.length}</b> · t=${t.toFixed(2)} s` +
    (note ? ` · ${note}` : "") +
    (sim ? "" : ` · <span class="err">缺渲染：runs/.venv-mj/bin/python viz/render_replay.py</span>`);

  $("finfo").innerHTML = `帧 <b>${i + 1}/${rf.length}</b> · 预设 <b>${
    (meta.renders ? meta.renders.presets.find(p => p.key === state.preset) || {} : {}).label || state.preset
  }</b> · ←/→ 键可逐帧`;
  document.querySelectorAll("#presets button").forEach(b =>
    b.classList.toggle("on", b.dataset.k === state.preset));
}

/* ---------- footer ---------- */
(function () {
  const bits = [`数据源 <code>viz/panel_data_v2.json</code>`];
  if (meta.generated_by) bits.push(`生成：<code>${meta.generated_by}</code>`);
  if (meta.source) bits.push(`复现数据：${meta.source}`);
  if (meta.renders) bits.push(`渲染目录 <code>${meta.renders.dir}</code>`);
  $("foot").innerHTML = bits.join(" · ") +
    ` · 支持直接双击打开（file://），或 <code>python -m http.server</code> 后访问。`;
})();

/* preload everything, then draw */
vf.forEach(preload);
rf.forEach((_, i) => preload(renderSrc(i)));
/* deep-link: ?p=close&f=2 selects preset / replay frame (1-based) */
const qp = new URLSearchParams(location.search);
const qpP = qp.get("p");
if (meta.renders && meta.renders.presets.some(p => p.key === qpP))
  state.preset = qpP;
const qpF = parseInt(qp.get("f"), 10);
draw(Number.isFinite(qpF) ? Math.min(rf.length, Math.max(1, qpF)) - 1 : 0);
/* headless-verification hook: assertions read this from dump-dom */
document.documentElement.dataset.boot = JSON.stringify({
  frames: rf.length, gates: (D.gates || []).length,
  video: vf.length, preset: state.preset, rendered: true,
});
</script>
</body>
</html>
